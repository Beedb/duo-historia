<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DUOPobre</title>
  <meta name="description" content="Lições curtas de História e Matemática com XP, vidas, streak e revisão de erros.">
  <meta name="theme-color" content="#9b3a22">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icone-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">

    <!-- Painel fixo: streak, XP e vidas -->
    <header class="painel">
      <span class="marca">DUOPobre</span>
      <span class="painel-dados">
        <span class="painel-item" id="painel-streak">0 dias</span>
        <span class="painel-item" id="painel-xp">0 XP</span>
        <span class="painel-item" id="painel-vidas">5 vidas</span>
      </span>
    </header>

    <!-- Tela 1: trilha (áreas, matérias, tempos/assuntos e níveis) -->
    <section id="tela-trilha" class="tela">
      <div class="abas escondida" id="abas-areas" role="group" aria-label="Área de estudo"></div>
      <h1 id="titulo-trilha">Linha do tempo</h1>
      <p class="aviso" id="aviso-trilha" role="status"></p>
      <button id="botao-instalar" class="botao botao-secundario escondida">Instalar no celular</button>
      <button id="botao-revisao" class="botao botao-secundario" disabled>Revisão</button>
      <div id="lista-materias" class="lista-materias"></div>
    </section>

    <!-- Tela 2: início da lição -->
    <section id="tela-inicio" class="tela escondida">
      <p class="materia" id="inicio-materia"></p>
      <h1 id="inicio-titulo"></h1>
      <p class="resumo" id="inicio-resumo"></p>
      <button id="botao-comecar" class="botao botao-principal" disabled>Começar</button>
      <button id="botao-voltar-inicio" class="botao botao-secundario">← Voltar à trilha</button>
    </section>

    <!-- Tela 3: questão -->
    <section id="tela-questao" class="tela escondida">
      <div class="topo-questao">
        <button id="botao-sair" class="botao botao-sair" aria-label="Sair da lição">✕</button>
        <div class="barra"><div class="barra-preenchida" id="barra-progresso"></div></div>
      </div>
      <p class="contador" id="contador"></p>
      <p class="tipo-questao" id="tipo-questao"></p>

      <blockquote class="trecho escondida" id="trecho">
        <p id="trecho-texto"></p>
        <cite id="trecho-autor"></cite>
      </blockquote>

      <h2 class="pergunta" id="pergunta"></h2>
      <div class="opcoes" id="opcoes"></div>
      <button id="botao-conferir" class="botao botao-principal escondida" disabled>Conferir</button>

      <div class="feedback escondida" id="feedback" role="status">
        <p class="feedback-titulo" id="feedback-titulo"></p>
        <p class="feedback-resposta" id="feedback-resposta"></p>
        <p id="feedback-explicacao"></p>
        <button id="botao-continuar" class="botao botao-principal">Continuar</button>
      </div>
    </section>

    <!-- Tela 4: resultado -->
    <section id="tela-resultado" class="tela escondida">
      <h1 id="resultado-titulo">Lição concluída!</h1>
      <p class="nota" id="nota"></p>
      <p id="nota-texto"></p>
      <p class="resultado-xp" id="resultado-xp"></p>
      <p class="resultado-extra" id="resultado-extra"></p>
      <button id="botao-voltar" class="botao botao-principal">Voltar à trilha</button>
    </section>

  </main>

  <!-- Ordem importa: as funções usadas pelo app.js precisam ser carregadas antes -->
  <script src="js/progresso.js"></script>
  <script src="js/montagem.js"></script>
  <script src="js/numerica.js"></script>
  <script src="js/licao.js"></script>
  <script src="js/revisao.js"></script>
  <script src="js/trilha.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
